name: Issue triage
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m examples.issue_triage.main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The hosted GitHub MCP server needs a personal access token (fine-grained,
          # Issues: read/write on this repo), not the built-in GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.TRIAGE_GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: "false"
